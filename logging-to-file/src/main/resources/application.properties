# Đường dẫn xuất file log (tự động tạo thư mục logs ở gốc dự án)
logging.file.name=logs/patient_web_service.log

# Kích thước tối đa của mỗi file log là 2MB
logging.logback.rollingpolicy.max-file-size=2MB

# Tự động nén thành file .gz khi file đầy hoặc qua ngày mới
logging.logback.rollingpolicy.file-name-pattern=logs/patient_web_service.%d{yyyy-MM-dd}.%i.gz

# Lưu trữ tối đa 7 ngày
logging.logback.rollingpolicy.max-history=7